id: woodlands-chief-forester
name: Woodlands Chief Forester
version: 1.0.0

services:
  # Fabric SSO in the deployed app. Email and password stays enabled so the
  # dashboard can be demonstrated locally without a Fabric tenant, which is what
  # makes this runnable during the workshop before anyone has the app workload
  # switched on.
  auth:
    enabled: true
    expiryInMinutes: 60
    refreshToken:
      lifetimeInDays: 30
    scopes:
      - read:data
      - write:data
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5173/auth/callback
    password:
      enabled: true
    fabric:
      enabled: true

  # Managed SQL database in Fabric. Schema comes from rayfin/data/*.ts and is
  # applied with `npx rayfin up db apply`. Never edit it in the portal: the app
  # and the database will disagree and the next deploy will fail.
  data:
    enabled: true
    dialect: mssql

  storage:
    enabled: false

  staticHosting:
    enabled: true
    root: .
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
